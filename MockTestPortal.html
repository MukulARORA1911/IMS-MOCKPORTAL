<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a43">
<title>MockTest — IMS Ahmedabad</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css">
<style>:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f5f8f6; --text:#1c2220; --muted:#59645e; --line:#dde5e0;
  --green:#1f7a43; --green-d:#165c32; --green-l:#e8f5ec; --green-m:#bfe3cb;
  --red:#b3261e; --red-l:#fdecea; --amber:#a35f00; --amber-l:#fff4e0; --violet:#5b43b5; --violet-l:#efebfb; --grey:#e9eeeb;
  --radius:10px; --tap:48px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font);-webkit-tap-highlight-color:transparent}
h1,h2,h3{line-height:1.25;margin:0 0 .5em;font-weight:650}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:0 0 .8em}
a{color:var(--green-d)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.narrow{max-width:520px}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.right{text-align:right} .center{text-align:center} .nowrap{white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.stack>*+*{margin-top:12px} .stack-lg>*+*{margin-top:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1 1 auto;min-width:0} .between{justify-content:space-between}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 18px;border-radius:var(--radius);border:1.5px solid var(--line);background:#fff;color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn:hover{border-color:#b9c7be} .btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.pal-btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7bc496;outline-offset:2px}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff} .btn-primary:hover{background:var(--green-d);border-color:var(--green-d)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:36px;padding:0 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}

/* forms */
label{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.field{margin-bottom:14px}
input[type=text],input[type=password],input[type=number],input[type=search],input[type=datetime-local],input[type=email],select,textarea{width:100%;min-height:var(--tap);padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius);background:#fff}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--green)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.err{color:var(--red);font-size:.9rem;margin:8px 0}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.soft{background:var(--soft)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)} .g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.stat .v{font-size:1.5rem;font-weight:700;line-height:1.2}
.stat .l{font-size:.8rem;color:var(--muted)}
.stat.good .v{color:var(--green)} .stat.bad .v{color:var(--red)} .stat.warn .v{color:var(--amber)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:650;background:var(--grey);color:var(--text);white-space:nowrap}
.b-green{background:var(--green-l);color:var(--green-d)} .b-red{background:var(--red-l);color:var(--red)} .b-amber{background:var(--amber-l);color:var(--amber)} .b-violet{background:var(--violet-l);color:var(--violet)}
.b-A{background:var(--green-l);color:var(--green-d)} .b-B{background:var(--amber-l);color:var(--amber)} .b-C{background:var(--red-l);color:var(--red)}
.notice{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:.92rem}
.notice.warn{background:var(--amber-l);border-color:#f1cf94} .notice.bad{background:var(--red-l);border-color:#f0b7b2} .notice.ok{background:var(--green-l);border-color:var(--green-m)}
.demo-tag{font-size:.7rem;background:var(--amber-l);color:var(--amber);padding:1px 7px;border-radius:99px;font-weight:700;letter-spacing:.03em}

/* top bar */
.topbar{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-weight:750;color:var(--green-d);letter-spacing:-.01em;text-decoration:none}
.brand span{color:var(--text)}
main.page{padding:20px 0 60px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:650;white-space:nowrap;font-size:.82rem;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}

/* chips & tabs */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true],.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:56px;background:#fff;z-index:10;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 14px;border:0;background:none;font-weight:650;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--green-d);border-bottom-color:var(--green)}

/* rich text */
.rt{overflow-wrap:anywhere;word-break:break-word}
.rt p{margin:0 0 .7em} .rt p:last-child{margin:0}
.rt img{max-width:100%;height:auto;display:block;margin:.5em 0;border-radius:6px;cursor:zoom-in;background:#fff}
.rt .rt-table{overflow-x:auto;margin:.6em 0;max-width:100%}
.rt table{width:auto;min-width:50%;border:1px solid var(--line)} .rt th,.rt td{border:1px solid var(--line);padding:6px 12px}
.rt .katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.rt code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:.9em}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:400px}
.logo{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--green);color:#fff;font-weight:800;margin-bottom:10px}

/* test list */
.test-card{display:flex;flex-direction:column;gap:8px}
.test-card h3{margin:0}

/* toast */
#toasts{position:fixed;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:400;pointer-events:none;padding:0 12px}
.toast{background:#1c2220;color:#fff;padding:10px 16px;border-radius:10px;font-size:.92rem;box-shadow:var(--shadow);max-width:480px}
.toast.bad{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(20,28,24,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:720px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.spinner{width:22px;height:22px;border:3px solid var(--green-m);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}
.loading{padding:40px;text-align:center;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* ---------------- exam ---------------- */
body.exam-mode{background:#fff;overscroll-behavior:none}
.x{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.xh{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.xh-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xh-sec{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em;padding:4px 12px;border-radius:10px;background:var(--green-l);color:var(--green-d);min-width:104px;text-align:center}
.timer small{display:block;font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8;line-height:1}
.timer.warn{background:var(--amber-l);color:var(--amber)} .timer.crit{background:var(--red-l);color:var(--red);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.65}} @media(prefers-reduced-motion:reduce){.timer.crit{animation:none}}
.xsub{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--soft);border-bottom:1px solid var(--line);font-size:.85rem}
.sync{display:inline-flex;align-items:center;gap:6px;font-weight:650}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.sync.off{color:var(--red)} .sync.off i{background:var(--red)} .sync.busy{color:var(--amber)} .sync.busy i{background:var(--amber)}
.xbanner{padding:8px 12px;background:var(--amber-l);color:#6b4000;font-size:.88rem;border-bottom:1px solid #f1cf94}
.xmain{flex:1;display:block;padding:12px 12px 150px;max-width:1200px;width:100%;margin:0 auto;-webkit-user-select:none;user-select:none}
.qcard{border:1px solid var(--line);border-radius:12px;padding:14px}
.qmeta{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.qmeta b{color:var(--text);font-size:1rem}
.qtext{font-size:1.06rem;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;touch-action:manipulation}
.opt:hover{border-color:#a9c9b5}
.optk{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid #b8c6be;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:.95rem}
.optv{flex:1;padding-top:3px;font-size:1.02rem}
.opt[aria-checked=true]{border-color:var(--green);background:var(--green-l)}
.opt[aria-checked=true] .optk{background:var(--green);border-color:var(--green);color:#fff}
.xbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xbar .btn{min-height:46px;padding:0 8px;font-size:.92rem}
.xbar .primary{grid-column:2}
.btn-review{border-color:var(--violet);color:var(--violet)}
.palette{margin-top:14px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:.8rem;margin-bottom:10px}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex:0 0 auto}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.pal-btn{position:relative;height:46px;border-radius:10px;border:2px solid transparent;font-weight:700;cursor:pointer;touch-action:manipulation}
.s-nv{background:#eef1ef;color:#46514b;border-color:#d4dcd7}
.s-na{background:var(--red-l);color:var(--red);border-color:#e9aaa5}
.s-a{background:var(--green);color:#fff;border-color:var(--green-d)}
.s-m{background:var(--violet);color:#fff;border-color:#43308f;border-radius:50%}
.s-am{background:var(--violet);color:#fff;border-color:#43308f;border-radius:50%}
.s-am::after{content:"";position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid #fff}
.pal-btn.cur{outline:3px solid var(--text);outline-offset:2px}
.sec-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,28,24,.5);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:16px;z-index:61}
@media(min-width:900px){
  .xmain{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding-bottom:110px;align-items:start}
  .palette{margin-top:0;position:sticky;top:130px;border:1px solid var(--line);border-radius:12px;padding:14px}
  .xbar{grid-template-columns:repeat(4,auto);justify-content:center;gap:10px}
  .xbar .primary{grid-column:auto}
  .xbar .btn{padding:0 22px}
  .pal-toggle{display:none}
}
@media(max-width:899px){.palette.desk{display:none}}
.overlay{position:fixed;inset:0;z-index:500;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.overlay .box{max-width:520px}
.overlay.warn{background:#fff5f4}
.overlay h1{color:var(--red)}
.review-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.review-grid{grid-template-columns:repeat(4,1fr)}}

/* analytics */
.q-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;width:100%}
.q-row:hover{background:var(--soft)}
.q-row .qn{grid-row:1/3;font-weight:800;min-width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.qn.correct{background:var(--green-l);color:var(--green-d)} .qn.incorrect{background:var(--red-l);color:var(--red)} .qn.skipped{background:var(--grey);color:#46514b}
.q-prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-sub{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.q-list{display:grid;gap:8px}
.optrow{display:flex;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;align-items:flex-start}
.optrow.is-correct{border-color:var(--green);background:var(--green-l)} .optrow.is-wrong{border-color:var(--red);background:var(--red-l)}
.time-cmp td,.time-cmp th{padding:8px 10px}
.bar{height:10px;border-radius:6px;background:var(--grey);overflow:hidden} .bar>i{display:block;height:100%;background:var(--green)}
.ins{padding:8px 12px;border-left:4px solid var(--green);background:var(--soft);border-radius:0 8px 8px 0;font-size:.92rem}
.ins.slow,.ins.inefficient,.ins.effort_wasted,.ins.unanswered_time{border-color:var(--amber);background:var(--amber-l)}
.ins.rushed{border-color:var(--red);background:var(--red-l)}
.chart{width:100%;max-width:640px;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#1c2220;color:#fff;font-size:.8rem;padding:6px 10px;border-radius:8px;transform:translate(-50%,-110%);white-space:nowrap;z-index:5}
.chart-box{position:relative}
@media print{.topbar,.tabs,.xbar{display:none}}

.brand-logo{height:40px;width:auto;margin-left:4px;flex:0 0 auto}
.login-logo{height:64px;width:auto;margin:0 auto 6px;display:block}
@media(max-width:520px){.topbar .wrap{gap:8px}.topbar .uname{max-width:26vw!important}.brand-logo{height:34px}}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--text);font-weight:600;font-size:.92rem;white-space:nowrap}
.nav a.on{background:var(--green-l);color:var(--green-d)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select{width:auto;min-width:130px;flex:1 1 140px;min-height:42px}
.editor-grid{display:grid;gap:14px}
@media(min-width:900px){.editor-grid.two{grid-template-columns:1fr 1fr}}
.mini-ta{min-height:64px}
.preview{border:1px dashed var(--line);border-radius:10px;padding:12px;background:var(--soft)}
.qpick tr.sel td{background:var(--green-l)}
.qpick td.txt{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tq{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tq .ctl{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tq .ctl select,.tq .ctl input{width:auto;min-height:34px;padding:4px 8px}
.tq .ctl input{width:74px}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
.sticky-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spinner"></span><p>Loading MockTest…</p></div></div>
<script>window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&a.querySelector('.loading'))a.innerHTML='<pre style="padding:16px;white-space:pre-wrap;color:#b3261e">Startup error: '+String(e.message).replace(/</g,'&lt;')+'</pre>'});</script>
<script>
// ===== SETTINGS (edit here if you ever create a new Apps Script deployment) =====
window.__API__ = 'https://script.google.com/macros/s/AKfycby7WwRwl4-i__uvXzXVEUlF_Whio0zC9eI6M3PFB8MziyoWD0pfQET-t9q8nR3i83af/exec';   // your Apps Script web app URL (ends with /exec)
window.__AUTH__ = 'name_pin';   // must match STUDENT_AUTH in Code.gs: 'name_pin' (PIN + first name) or 'pin'
